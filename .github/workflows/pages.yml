name: Deploy NEON OVERCLOCK to GitHub Pages

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the game
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify the game
        run: |
          npm run check
          npm test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble the Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/assets
          cp index.html app.js engine.js appearance.js renderer.js campaign.js campaign-ui.js style.css _site/
          cp -R assets/characters assets/sprites _site/assets/
          cp assets/share-preview.png _site/assets/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
